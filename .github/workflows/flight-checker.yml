name: Flight checker

on:
  schedule:
    - cron: "43 0 * * *" # every day at 00:43 UTC (07:43 in Vietnam)
  workflow_dispatch:

permissions:
  contents: write # commit the seen-flights state file
  issues: write # open an issue when new flights show up
  actions: write # turn this workflow off once the flight date has passed

concurrency:
  group: flight-checker

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flight-checker/requirements.txt

      - run: pip install -r flight-checker/requirements.txt

      - name: Check flights
        id: check
        env:
          # Optional. Without it, Google Flights is scraped directly.
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: >-
          python flight-checker/check_flights.py
          --origin SGN --destination DLI --date 2026-12-18
          --report-file report.md

      - name: Write job summary
        if: hashFiles('report.md') != ''
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Before saving state, so a failure here re-alerts next run instead of
      # losing the alert.
      - name: Open an issue for new flights
        if: steps.check.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          { cat report.md; echo; echo "cc @$GITHUB_REPOSITORY_OWNER"; } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue.md

      - name: Save seen flights
        if: steps.check.outputs.state_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-checker/state
          git commit -m "flight-checker: update seen flights"
          git push

      - name: Turn off after the flight date
        if: steps.check.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY"
